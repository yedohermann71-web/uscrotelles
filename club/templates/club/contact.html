{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact - US Crotelles</title>

    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #00ff88;
            margin-top: 30px;
        }

        .container {
            width: 60%;
            margin: 40px auto;
            background: #111;
            padding: 30px;
            border-radius: 10px;
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
        }

        button {
            background: #00ff88;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00cc6a;
        }
    </style>
</head>

<body>

<h1>Contact</h1>

<div class="container">
    <p>Une question ? Contactez-nous ⚽</p>

    <form>
        <input type="text" placeholder="Nom"><br>
        <input type="email" placeholder="Email"><br>
        <textarea rows="5" placeholder="Votre message"></textarea><br>
        <button type="submit">Envoyer</button>
    </form>

    <p>Email : uscrotelles@gmail.com</p>
</div>

</body>
</html>
